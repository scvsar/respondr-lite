name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".github/agents/**"
      - ".github/hooks/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/copilot-instructions.md"
      - ".mcp.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/test-agent-artifacts.ps1"
      - "backend/requirements.txt"
      - "functions/requirements.txt"
      - "frontend/package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".github/agents/**"
      - ".github/hooks/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/copilot-instructions.md"
      - ".mcp.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/test-agent-artifacts.ps1"
      - "backend/requirements.txt"
      - "functions/requirements.txt"
      - "frontend/package-lock.json"

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared agent artifacts
        shell: pwsh
        run: ./scripts/test-agent-artifacts.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r backend/requirements.txt
          uv pip install --python .venv/bin/python -r functions/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Azure local tools
        run: npm install --global azure-functions-core-tools@4 azurite

      - name: Verify developer tools
        run: |
          .venv/bin/python --version
          node --version
          npm --version
          func --version
          azurite --version
