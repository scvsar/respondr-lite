[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "respondr-eval"
version = "0.1.0"
description = "Reproducible evaluation tools for Respondr Lite extraction strategies"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
labeling = [
  "fastapi>=0.104.1",
  "uvicorn>=0.24.0",
]
llm = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
]
ml = [
  "scikit-learn>=1.5,<2",
]
test = [
  "fastapi>=0.104.1",
  "httpx>=0.27",
  "openai>=1.0.0",
  "pytest>=8",
  "python-dotenv>=1.0.0",
  "scikit-learn>=1.5,<2",
  "tzdata>=2024.1",
  "uvicorn>=0.24.0",
]

[project.scripts]
respondr-eval = "respondr_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["respondr_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
